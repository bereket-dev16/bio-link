name: MNC Bio Link

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mnc-bio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript kontrolü ve MNC üretim derlemesi
        run: npm run build
        env:
          VITE_BRAND: mnc
      - name: cPanel yayını (explicit FTPS)
        if: github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/deploy.py
